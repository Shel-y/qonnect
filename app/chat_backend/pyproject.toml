[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-backend"
version = "0.1.0"
# Lambda managed runtime: Python 3.13 on arm64
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web framework — runs inside Lambda via Lambda Web Adapter
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # AWS SDK — provided by Lambda managed runtime but pinned for local dev
    "boto3>=1.44.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
